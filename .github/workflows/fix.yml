          git add -A
          git commit -m "Complete fix: security + RTL + ping + build" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parsavip-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

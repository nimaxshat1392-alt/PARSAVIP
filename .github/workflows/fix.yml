name: Build PARSAVIP APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Backup my files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/pubspec.yaml

      - name: Clean android folder
        run: |
          rm -rf android
          rm -rf .metadata
          rm -rf build
          rm -rf .dart_tool

      - name: Generate fresh android
        run: |
          flutter create --platforms=android --project-name=parsavip --org=com.parsavip .

      - name: Restore my files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib ./lib
          cp /tmp/backup/pubspec.yaml ./pubspec.yaml
          rm -rf test

      - name: Change app name to PARSAVIP
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="parsavip"|android:label="PARSAVIP"|' $MANIFEST
          echo "=== AndroidManifest ==="
          cat $MANIFEST

      - name: Add INTERNET permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' $MANIFEST
          echo "=== After permission ==="
          head -10 $MANIFEST

      - name: Commit android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/ .metadata
          git commit -m "Fresh android folder" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parsavip-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

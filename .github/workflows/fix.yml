name: Build PARSAVIP

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🗑️ Remove v2rayNG Native code
        run: |
          rm -rf android/app/src/main/java/com/v2ray || true
          rm -rf android/app/src/main/kotlin/com/v2ray || true
          rm -f android/app/libs/libXray.aar || true
          rm -f android/app/libs/libv2ray.aar || true
          echo "=== Cleaned. Remaining Native files ==="
          find android/app/src/main/java -name "*.kt" 2>/dev/null | head -20 || echo "None"

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove v2rayNG Native code - use flutter_vless" || echo "Nothing"
          git push || echo "Nothing"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error 

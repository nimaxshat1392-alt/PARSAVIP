name: Build PARSAVIP with v2rayNG Native

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clone v2rayNG source
        run: |
          git clone --depth 1 https://github.com/2dust/v2rayNG.git /tmp/v2rayNG

      - name: Find libv2ray.aar in v2rayNG
        run: |
          find /tmp/v2rayNG -name "*.aar" -o -name "*.jar" | head -20
          echo "=== libs folder ==="
          ls -la /tmp/v2rayNG/V2rayNG/app/libs/ 2>/dev/null || true
          echo "=== Service folder ==="
          ls -la /tmp/v2rayNG/V2rayNG/app/src/main/java/com/v2ray/ang/service/ 2>/dev/null || true

      - name: Download libv2ray.aar from v2rayNG releases
        run: |
          mkdir -p android/app/libs
          cd android/app/libs
          # از release های AndroidLibV2rayLite استفاده می‌کنیم
          curl -L -f -o libv2ray.aar \
            "https://github.com/2dust/AndroidLibV2rayLite/releases/latest/download/libv2ray.aar" || \
          curl -L -f -o libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libXray.aar" || true
          ls -la

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk

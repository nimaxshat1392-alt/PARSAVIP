          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';
          import '../models/log_entry.dart';
          import '../providers/app_state.dart';
          import '../theme/app_theme.dart';
          import '../widgets/glass_card.dart';
          import '../widgets/gradient_background.dart';

          class LogsScreen extends StatelessWidget {
            const LogsScreen({super.key});
            @override
            Widget build(BuildContext context) {
              final app = context.watch<AppState>();
              final logs = app.logs.logs;
              return Scaffold(
                extendBodyBehindAppBar: true,
                appBar: AppBar(title: const Text('گزارش‌ها'), actions: [
                  IconButton(icon: const Icon(Icons.delete_sweep_rounded), onPressed: () => app.logs.clear()),
                ]),
                body: GradientBackground(child: SafeArea(child: logs.isEmpty
                  ? const Center(child: Text('هیچ گزارشی موجود نیست', style: TextStyle(color: C.textSecondary)))
                  : ListView.separated(
                    padding: const EdgeInsets.all(16),
                    itemCount: logs.length,
                    separatorBuilder: (_, __) => const SizedBox(height: 8),
                    itemBuilder: (_, i) => _LogTile(entry: logs[i]),
                  ))),
              );
            }
          }

          class _LogTile extends StatelessWidget {
            final LogEntry entry;
            const _LogTile({required this.entry});
            @override
            Widget build(BuildContext context) {
              final color = entry.level == LogLevel.info ? C.info
                : entry.level == LogLevel.warning ? C.warning
                : entry.level == LogLevel.error ? C.danger : C.success;
              return GlassCard(padding: const EdgeInsets.all(12), child: Row(children: [
                Container(width: 4, height: 40, decoration: BoxDecoration(color: color, borderRadius: BorderRadius.circular(2))),
                const SizedBox(width: 10),
                Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text('${entry.icon} ${entry.message}', style: const TextStyle(fontSize: 12)),
                  const SizedBox(height: 2),
                  Text(_fmt(entry.timestamp), textDirection: TextDirection.ltr,
                    style: const TextStyle(fontSize: 10, color: C.textHint)),
                ])),
              ]));
            }
            String _fmt(DateTime d) {
              final h = d.hour.toString().padLeft(2, '0');
              final m = d.minute.toString().padLeft(2, '0');
              return '$h:$m - ${d.year}/${d.month}/${d.day}';
            }
          }
          EOF


                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                    padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 14),
                  ),
                ),
                inputDecorationTheme: InputDecorationTheme(
                  filled: true, fillColor: C.bgCardLight,
                  hintStyle: const TextStyle(color: C.textHint),
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(14), borderSide: BorderSide.none,
                  ),
                  focusedBorder: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(14),
                    borderSide: const BorderSide(color: C.secondary, width: 1.5),
                  ),
                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14),
                ),
                snackBarTheme: SnackBarThemeData(
                  backgroundColor: C.bgCardLight,
                  contentTextStyle: GoogleFonts.vazirmatn(color: Colors.white),
                  behavior: SnackBarBehavior.floating,
                ),
              );
            }
          }
          EOF

          # --- Models ---
          cat > lib/models/vpn_config.dart << 'EOF'
          enum VpnProtocol { ss, vless, vmess, trojan, unknown }

          class VpnConfig {
            final String id;
            final String name;
            final VpnProtocol protocol;
            final String rawUri;
            final String host;
            final int port;
            int? ping;

            VpnConfig({
              required this.id, required this.name, required this.protocol,
              required this.rawUri, required this.host, required this.port, this.ping,
            });

            String get protocolShort {
              switch (protocol) {
                case VpnProtocol.ss: return 'SS';
                case VpnProtocol.vless: return 'VLESS';
                case VpnProtocol.vmess: return 'VMess';
                case VpnProtocol.trojan: return 'Trojan';
                case VpnProtocol.unknown: return '?';
              }
            }

            Map<String, dynamic> toJson() => {
              'id': id, 'name': name, 'protocol': protocol.name,
              'rawUri': rawUri, 'host': host, 'port': port, 'ping': ping,
            };

            factory VpnConfig.fromJson(Map<String, dynamic> j) => VpnConfig(
              id: j['id'], name: j['name'],
              protocol: VpnProtocol.values.firstWhere(
                (p) => p.name == j['protocol'],
                orElse: () => VpnProtocol.unknown,
              ),
              rawUri: j['rawUri'], host: j['host'], port: j['port'], ping: j['ping'],
            );
          }
          EOF

          cat > lib/models/log_entry.dart << 'EOF'
          enum LogLevel { info, warning, error, success }

          class LogEntry {
            final String id;
            final LogLevel level;
            final String message;
            final DateTime timestamp;

            LogEntry({
              required this.id, required this.level,
              required this.message, required this.timestamp,
            });

            Map<String, dynamic> toJson() => {
              'id': id, 'level': level.name,
              'message': message, 'timestamp': timestamp.toIso8601String(),
            };

            factory LogEntry.fromJson(Map<String, dynamic> j) => LogEntry(
              id: j['id'],
              level: LogLevel.values.firstWhere(
                (l) => l.name == j['level'],
                orElse: () => LogLevel.info,
              ),
              message: j['message'],
              timestamp: DateTime.tryParse(j['timestamp'] ?? '') ?? DateTime.now(),
            );

            String get icon {
              switch (level) {
                case LogLevel.info: return 'ℹ️';
                case LogLevel.warning: return '⚠️';
                case LogLevel.error: return '❌';
                case LogLevel.success: return '✅';
              }
            }
          }
          EOF

          # --- Services ---
          cat > lib/services/config_parser.dart << 'EOF'
          import 'dart:convert';
          import '../models/vpn_config.dart';

          class ConfigParser {
            static VpnConfig? parse(String uri, {int index = 0}) {
              uri = uri.trim();
              if (uri.isEmpty) return null;
              try {
                if (uri.startsWith('ss://')) return _ss(uri, index);
                if (uri.startsWith('vless://')) return _vless(uri, index);
                if (uri.startsWith('vmess://')) return _vmess(uri, index);
                if (uri.startsWith('trojan://')) return _trojan(uri, index);
              } catch (_) {}
              return null;
            }

            static VpnConfig _ss(String uri, int i) {
              final body = uri.substring(5).split('#').first;
              String d = body;
              if (!body.contains('@')) { d = _b64(body); }
              else {
                final at = body.indexOf('@');
                if (!body.substring(0, at).contains(':')) {
                  d = '${_b64(body.substring(0, at))}@${body.substring(at + 1)}';
                }
              }
              final at = d.lastIndexOf('@');
              final hp = d.substring(at + 1);
              final p = hp.split(':');
              return VpnConfig(id: 'ss_${i}_${p[0].hashCode}', name: 'PARSAVIP',
                protocol: VpnProtocol.ss, rawUri: uri, host: p[0],
                port: int.tryParse(p.length > 1 ? p[1].split('/').first : '443') ?? 443);
            }

            static VpnConfig _vless(String uri, int i) {
              final u = Uri.parse(uri);
              return VpnConfig(id: 'vless_${i}_${u.host.hashCode}', name: 'PARSAVIP',
                protocol: VpnProtocol.vless, rawUri: uri, host: u.host,
                port: u.port == 0 ? 443 : u.port);
            }

            static VpnConfig _vmess(String uri, int i) {
              final j = jsonDecode(_b64(uri.substring(8))) as Map<String, dynamic>;
              final host = (j['add'] ?? '').toString();
              return VpnConfig(id: 'vmess_${i}_${host.hashCode}', name: 'PARSAVIP',
                protocol: VpnProtocol.vmess, rawUri: uri, host: host,
                port: int.tryParse((j['port'] ?? '443').toString()) ?? 443);
            }

            static VpnConfig _trojan(String uri, int i) {
              final u = Uri.parse(uri);
              return VpnConfig(id: 'trojan_${i}_${u.host.hashCode}', name: 'PARSAVIP',
                protocol: VpnProtocol.trojan, rawUri: uri, host: u.host,
                port: u.port == 0 ? 443 : u.port);
            }

            static String _b64(String s) {
              s = s.replaceAll('-', '+').replaceAll('_', '/');
              while (s.length % 4 != 0) { s += '='; }
              return utf8.decode(base64.decode(s));
            }
          }
          EOF

          cat > lib/services/storage_service.dart << 'EOF'
          import 'dart:convert';
          import 'dart:io';
          import 'package:crypto/crypto.dart';
          import '../models/vpn_config.dart';

          class StorageService {
            static const _adminHash = '3c59ae2b5c3ea2eddd0e7ffe1a3e7e78ccd46fe2b03e2b3f6f0e0e3c8c5d5e2a';

            File get _configFile => File('${Directory.systemTemp.path}/parsavip_configs.json');
            File get _selectedFile => File('${Directory.systemTemp.path}/parsavip_selected.txt');
            File get _adminFile => File('${Directory.systemTemp.path}/parsavip_admin.txt');

            Future<List<VpnConfig>> loadConfigs() async {
              try {
                if (!await _configFile.exists()) return [];
                final raw = await _configFile.readAsString();
                if (raw.isEmpty) return [];
                final list = jsonDecode(raw) as List;
                return list.map((e) => VpnConfig.fromJson(e)).toList();
              } catch (_) { return []; }
            }

            Future<void> saveConfigs(List<VpnConfig> c) async {
              try {
                await _configFile.writeAsString(jsonEncode(c.map((e) => e.toJson()).toList()));
              } catch (_) {}
            }

            Future<String?> loadSelectedId() async {
              try {
                if (!await _selectedFile.exists()) return null;
                final v = await _selectedFile.readAsString();
                return v.isEmpty ? null : v;
              } catch (_) { return null; }
            }

            Future<void> saveSelectedId(String? id) async {
              try {
                if (id == null) {
                  if (await _selectedFile.exists()) await _selectedFile.delete();
                } else {
                  await _selectedFile.writeAsString(id);
                }
              } catch (_) {}
            }

            Future<bool> verifyAdmin(String pass) async {
              final hash = sha256.convert(utf8.encode(pass.trim())).toString();
              return hash == _adminHash;
            }

            Future<void> setAdminSession(bool v) async {
              try { await _adminFile.writeAsString(v ? '1' : '0'); } catch (_) {}
            }

            Future<bool> isAdminSession() async {
              try {
                if (!await _adminFile.exists()) return false;
                return (await _adminFile.readAsString()) == '1';
              } catch (_) { return false; }
            }
          }
          EOF

          cat > lib/services/ping_service.dart << 'EOF'
          import 'dart:io';
          import '../models/vpn_config.dart';

          class PingService {
            PingService._();
            static const int offlineThreshold = 9999;
            static const Duration timeout = Duration(seconds: 5);

            static Future<int?> pingOne(VpnConfig config) async {
              if (config.host.isEmpty || config.port <= 0) return null;
              final sw = Stopwatch()..start();
              try {
                final socket = await Socket.connect(config.host, config.port, timeout: timeout);
                socket.destroy();
                sw.stop();
                return sw.elapsedMilliseconds;
              } catch (_) { return null; }
            }

            static Future<List<VpnConfig>> pingAll(List<VpnConfig> configs,
              {int concurrency = 8, void Function(int, int)? onProgress}) async {
              if (configs.isEmpty) return [];
              final out = <VpnConfig>[];
              int idx = 0, done = 0;

              Future<void> worker() async {
                while (true) {
                  final i = idx++;
                  if (i >= configs.length) return;
                  final c = configs[i];
                  final ms = await pingOne(c);
                  out.add(VpnConfig(
                    id: c.id, name: c.name, protocol: c.protocol,
                    rawUri: c.rawUri, host: c.host, port: c.port,
                    ping: ms ?? offlineThreshold,
                  ));
                  done++;
                  onProgress?.call(done, configs.length);
                }
              }

              final workerCount = concurrency < configs.length ? concurrency : configs.length;
              await Future.wait(List.generate(workerCount, (_) => worker()));
              out.sort((a, b) => (a.ping ?? offlineThreshold).compareTo(b.ping ?? offlineThreshold));
              return out;
            }

            static VpnConfig? best(List<VpnConfig> configs) {
              if (configs.isEmpty) return null;
              final sorted = [...configs]..sort((a, b) =>
                (a.ping ?? offlineThreshold).compareTo(b.ping ?? offlineThreshold));
              if ((sorted.first.ping ?? offlineThreshold) >= offlineThreshold) return null;
              return sorted.first;
            }
          }
          EOF

          cat > lib/services/log_service.dart << 'EOF'
          import 'dart:convert';
          import 'dart:io';
          import '../models/log_entry.dart';

          class LogService {
            static const int maxLogs = 500;
            final List<LogEntry> _buffer = [];

            File get _file => File('${Directory.systemTemp.path}/parsavip_logs.json');

            Future<void> init() async {
              try {
                if (!await _file.exists()) return;
                final raw = await _file.readAsString();
                if (raw.isEmpty) return;
                final list = jsonDecode(raw) as List;
                _buffer..clear()..addAll(list.map((e) => LogEntry.fromJson(e)));
              } catch (_) {}
            }

            List<LogEntry> get logs => List.unmodifiable(_buffer.reversed);

            Future<void> add(LogLevel level, String msg) async {
              _buffer.add(LogEntry(
                id: DateTime.now().microsecondsSinceEpoch.toString(),
                level: level, message: msg, timestamp: DateTime.now(),
              ));
              if (_buffer.length > maxLogs) {
                _buffer.removeRange(0, _buffer.length - maxLogs);
              }
              try {
                await _file.writeAsString(jsonEncode(_buffer.map((e) => e.toJson()).toList()));
              } catch (_) {}
            }

            Future<void> clear() async {
              _buffer.clear();
              try { if (await _file.exists()) await _file.delete(); } catch (_) {}
            }
          }
          EOF


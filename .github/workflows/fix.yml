name: Build PARSAVIP

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download libv2ray.aar
        run: |
          mkdir -p android/app/libs
          cd android/app/libs
          
          # لینک دانلود از مخزن AndroidLibXrayLite
          URL="https://github.com/nickolasgasworking/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          
          echo "Downloading from: $URL"
          curl -L -f -o libv2ray.aar "$URL"
          
          # بررسی حجم فایل برای اطمینان از صحت دانلود
          SIZE=$(stat -c%s libv2ray.aar)
          echo "Downloaded size: $SIZE bytes"
          
          # اگر حجم فایل کمتر از ۱ مگابایت باشد، یعنی دانلود ناموفق بوده
          if [ "$SIZE" -lt 1000000 ]; then
            echo "❌ Downloaded file is too small. Download failed."
            exit 1
          fi
          
          ls -la
          file libv2ray.aar

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk

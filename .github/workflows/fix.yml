          cat > lib/services/ping_service.dart << 'EOF'
          import 'dart:io';
          import '../models/vpn_config.dart';

          class PingService {
            PingService._();
            static const int offlineThreshold = 9999;
            static const Duration timeout = Duration(seconds: 5);

            static Future<int?> pingOne(VpnConfig config) async {
              if (config.host.isEmpty || config.port <= 0) return null;
              final sw = Stopwatch()..start();
              try {
                final socket = await Socket.connect(config.host, config.port, timeout: timeout);
                socket.destroy();
                sw.stop();
                return sw.elapsedMilliseconds;
              } catch (_) { return null; }
            }

            static Future<List<VpnConfig>> pingAll(
              List<VpnConfig> configs, {
              int concurrency = 8,
              void Function(int done, int total)? onProgress,
            }) async {
              if (configs.isEmpty) return [];
              final out = <VpnConfig>[];
              int idx = 0, done = 0;

              Future<void> worker() async {
                while (true) {
                  final i = idx++;
                  if (i >= configs.length) return;
                  final c = configs[i];
                  final ms = await pingOne(c);
                  out.add(VpnConfig(
                    id: c.id, name: c.name, protocol: c.protocol,
                    rawUri: c.rawUri, host: c.host, port: c.port,
                    ping: ms ?? offlineThreshold,
                  ));
                  done++;
                  onProgress?.call(done, configs.length);
                }
              }

              final wc = concurrency < configs.length ? concurrency : configs.length;
              await Future.wait(List.generate(wc, (_) => worker()));
              out.sort((a, b) => (a.ping ?? offlineThreshold).compareTo(b.ping ?? offlineThreshold));
              return out;
            }

            static VpnConfig? best(List<VpnConfig> configs) {
              if (configs.isEmpty) return null;
              final sorted = [...configs]..sort((a, b) =>
                (a.ping ?? offlineThreshold).compareTo(b.ping ?? offlineThreshold));
              if ((sorted.first.ping ?? offlineThreshold) >= offlineThreshold) return null;
              return sorted.first;
            }
          }
          EOF

          cat > lib/services/vpn_service.dart << 'EOF'
          import 'dart:async';
          import '../models/vpn_config.dart';

          enum VpnStatus { disconnected, connecting, connected, disconnecting, error }

          class VpnService {
            VpnStatus _status = VpnStatus.disconnected;
            VpnConfig? _current;
            final _statusCtrl = StreamController<VpnStatus>.broadcast();
            final _durationCtrl = StreamController<Duration>.broadcast();
            Timer? _timer;
            Duration _duration = Duration.zero;

            VpnStatus get status => _status;
            VpnConfig? get current => _current;
            Stream<VpnStatus> get statusStream => _statusCtrl.stream;
            Stream<Duration> get durationStream => _durationCtrl.stream;
            Duration get duration => _duration;
            bool get isConnected => _status == VpnStatus.connected;
            bool get isBusy => _status == VpnStatus.connecting || _status == VpnStatus.disconnecting;

            Future<void> initialize() async {}

            Future<bool> connect(VpnConfig config) async {
              if (isBusy || isConnected) return false;
              _status = VpnStatus.connecting;
              _statusCtrl.add(_status);
              _current = config;
              await Future.delayed(const Duration(milliseconds: 1200));
              _status = VpnStatus.connected;
              _statusCtrl.add(_status);
              _startTimer();
              return true;
            }

            Future<void> disconnect() async {
              if (!isConnected) return;
              _status = VpnStatus.disconnecting;
              _statusCtrl.add(_status);
              await Future.delayed(const Duration(milliseconds: 500));
              _status = VpnStatus.disconnected;
              _current = null;
              _stopTimer();
              _statusCtrl.add(_status);
            }

            Future<void> toggle(VpnConfig config) async {
              if (isConnected) { await disconnect(); }
              else { await connect(config); }
            }

            void _startTimer() {
              _duration = Duration.zero;
              _timer?.cancel();
              _timer = Timer.periodic(const Duration(seconds: 1), (_) {
                _duration += const Duration(seconds: 1);
                _durationCtrl.add(_duration);
              });
            }

            void _stopTimer() {
              _timer?.cancel();
              _timer = null;
              _duration = Duration.zero;
              _durationCtrl.add(_duration);
            }

            void dispose() {
              _timer?.cancel();
              _statusCtrl.close();
              _durationCtrl.close();
            }
          }
          EOF

          cat > lib/services/log_service.dart << 'EOF'
          import 'dart:convert';
          import 'dart:io';
          import '../models/log_entry.dart';

          class LogService {
            static const int maxLogs = 500;
            final List<LogEntry> _buffer = [];
            File get _file => File('${Directory.systemTemp.path}/parsavip_logs.json');

            Future<void> init() async {
              try {
                if (!await _file.exists()) return;
                final raw = await _file.readAsString();
                if (raw.isEmpty) return;
                final list = jsonDecode(raw) as List;
                _buffer..clear()..addAll(list.map((e) => LogEntry.fromJson(e)));
              } catch (_) {}
            }

            List<LogEntry> get logs => List.unmodifiable(_buffer.reversed);

            Future<void> add(LogLevel level, String msg) async {
              _buffer.add(LogEntry(
                id: DateTime.now().microsecondsSinceEpoch.toString(),
                level: level, message: msg, timestamp: DateTime.now(),
              ));
              if (_buffer.length > maxLogs) {
                _buffer.removeRange(0, _buffer.length - maxLogs);
              }
              try {
                await _file.writeAsString(jsonEncode(_buffer.map((e) => e.toJson()).toList()));
              } catch (_) {}
            }

            Future<void> clear() async {
              _buffer.clear();
              try { if (await _file.exists()) await _file.delete(); } catch (_) {}
            }
          }
          EOF


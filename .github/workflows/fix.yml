name: Build PARSAVIP with VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean android
        run: |
          rm -rf android .metadata .dart_tool build

      - name: Generate fresh android
        run: |
          flutter create --platforms=android --project-name=parsavip --org=com.parsavip .

      - name: Create Kotlin folders
        run: |
          mkdir -p android/app/src/main/kotlin/com/parsavip/app
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          ls -la android/app/src/main/kotlin/com/parsavip/

      - name: Clean lib
        run: |
          rm -rf lib test
          mkdir -p lib/theme lib/models lib/services lib/data lib/providers lib/widgets lib/screens

      - name: Download sing-box arm64
        run: |
          cd /tmp
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/sing-box-1.10.1-android-arm64.tar.gz"
          tar -xzf sing-box-1.10.1-android-arm64.tar.gz
          cp sing-box-1.10.1-android-arm64/sing-box \
             "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so"
          chmod +x "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so"
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"

      - name: Write pubspec
        run: |
          cat > pubspec.yaml << 'EOF'
          name: parsavip
          description: PARSAVIP VPN
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.3.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            provider: ^6.1.1
            google_fonts: ^6.2.1
            http: ^1.1.0
            crypto: ^3.0.3
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF

name: Show CoreMethods

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build AAR
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          git clone https://github.com/2dust/AndroidLibXrayLite.git /tmp/lib
          cd /tmp/lib
          go mod tidy
          gomobile bind -target=android/arm64 -androidapi=21 -o libv2ray.aar -v -ldflags="-checklinkname=0" .
          mkdir -p /tmp/aar_extract
          cd /tmp/aar_extract
          unzip -o /tmp/lib/libv2ray.aar
          mkdir -p classes
          cd classes
          unzip -o ../classes.jar

      - name: Print CoreController methods
        run: |
          cd /tmp/aar_extract/classes
          echo "═══════════════════════════════"
          echo "METHODS OF CoreController"
          echo "═══════════════════════════════"
          javap -p libv2ray/CoreController.class
          echo ""
          echo "═══════════════════════════════"
          echo "METHODS OF CoreCallbackHandler"
          echo "═══════════════════════════════"
          javap -p libv2ray/CoreCallbackHandler.class
          echo "═══════════════════════════════"
          echo "DONE"
          echo "═══════════════════════════════"

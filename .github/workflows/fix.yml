name: Build PARSAVIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Backup pubspec
        run: cp pubspec.yaml pubspec_backup.yaml

      - name: Regenerate android
        run: |
          rm -rf android .metadata
          flutter create --platforms=android --project-name=parsavip --org=com.parsavip .
          rm -rf test

      - name: Restore pubspec
        run: mv pubspec_backup.yaml pubspec.yaml

      - name: Show generated settings.gradle
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Show generated app/build.gradle
        run: |
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle

      - name: Fix manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="parsavip"|android:label="PARSAVIP"|' $MANIFEST || true
          cat $MANIFEST

      - name: Download sing-box
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          SB_VERSION="1.10.1"
          cd /tmp
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-android-arm64.tar.gz"
          tar -xzf "sing-box-${SB_VERSION}-android-arm64.tar.gz"
          cp "sing-box-${SB_VERSION}-android-arm64/sing-box" "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so"
          chmod +x "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so"
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"

      - name: Get dependencies
        run: flutter pub get

      - name: Show resolved versions
        run: |
          echo "=== pubspec.lock (partial) ==="
          grep -A 2 "shared_preferences_android" pubspec.lock || true
          grep -A 2 "package_info_plus" pubspec.lock || true

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parsavip-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

name: Build PARSAVIP

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download libXray.aar (with fallback URLs)
        run: |
          mkdir -p android/app/libs
          cd android/app/libs
          
          # تلاش از چند URL مختلف
          URLS=(
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v25.9.11/libXray.aar"
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v25.8.31/libXray.aar"
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v25.7.21/libXray.aar"
          )
          
          SUCCESS=0
          for URL in "${URLS[@]}"; do
            echo "Trying: $URL"
            curl -L -f -o libXray.aar "$URL" || continue
            SIZE=$(stat -c%s libXray.aar 2>/dev/null || stat -f%z libXray.aar)
            echo "Downloaded size: $SIZE bytes"
            if [ "$SIZE" -gt 1000000 ]; then
              echo "✅ File looks valid (>1MB)"
              SUCCESS=1
              break
            else
              echo "❌ File too small, trying next URL"
              rm -f libXray.aar
            fi
          done
          
          if [ "$SUCCESS" -eq 0 ]; then
            echo "❌ All URLs failed!"
            exit 1
          fi
          
          ls -la
          file libXray.aar

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk

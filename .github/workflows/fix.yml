name: Build PARSAVIP

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build libXray AAR (from XTLS)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          git clone https://github.com/XTLS/libXray.git /tmp/libXray
          cd /tmp/libXray
          go mod tidy
          gomobile bind -target=android/arm64,android/arm -androidapi=21 -o libXray.aar -v -ldflags="-checklinkname=0" .
          ls -la libXray.aar
          mkdir -p $GITHUB_WORKSPACE/android/app/libs
          cp libXray.aar $GITHUB_WORKSPACE/android/app/libs/
          ls -la $GITHUB_WORKSPACE/android/app/libs/

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk

name: Build PARSAVIP

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Remove incompatible UI folders
        run: |
          # حذف پوشه‌هایی که به منابع v2rayNG وابسته‌ن
          rm -rf android/app/src/main/java/com/v2ray/ang/ui || true
          rm -rf android/app/src/main/java/com/v2ray/ang/receiver || true
          rm -rf android/app/src/main/java/com/v2ray/ang/root || true
          rm -rf android/app/src/main/java/com/v2ray/ang/fmt || true
          echo "=== Remaining files ==="
          find android/app/src/main/java/com/v2ray/ang -name "*.kt" | wc -l

      - name: Commit cleaned files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove UI folders that break build" || echo "Nothing"
          git push || echo "Nothing"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

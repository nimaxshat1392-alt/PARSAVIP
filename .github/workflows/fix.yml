name: Build PARSAVIP with VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean android
        run: |
          rm -rf android .metadata .dart_tool build

      - name: Generate fresh android
        run: |
          flutter create --platforms=android --project-name=parsavip --org=com.parsavip .

      - name: Clean lib
        run: |
          rm -rf lib test
          mkdir -p lib/theme lib/models lib/services lib/data lib/providers lib/widgets lib/screens

      - name: Download sing-box arm64
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cd /tmp
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/sing-box-1.10.1-android-arm64.tar.gz"
          tar -xzf sing-box-1.10.1-android-arm64.tar.gz
          cp sing-box-1.10.1-android-arm64/sing-box \
             "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so"
          chmod +x "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so"
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/"

      - name: Write pubspec
        run: |
          cat > pubspec.yaml << 'EOF'
          name: parsavip
          description: PARSAVIP VPN
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.3.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            provider: ^6.1.1
            google_fonts: ^6.2.1
            http: ^1.1.0
            crypto: ^3.0.3
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF

      - name: Write MainActivity.kt
        run: |
          cat > android/app/src/main/kotlin/com/parsavip/app/MainActivity.kt << 'EOF'
          package com.parsavip.app

          import android.content.Intent
          import android.net.VpnService
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val METHOD_CHANNEL = "com.parsavip.app/vpn"
              private val EVENT_CHANNEL = "com.parsavip.app/vpn_events"
              private val VPN_PERMISSION_CODE = 0x0F01
              private var pendingJson: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, METHOD_CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  val config = call.argument<String>("config")
                                  if (config.isNullOrEmpty()) {
                                      result.error("INVALID", "Config empty", null)
                                      return@setMethodCallHandler
                                  }
                                  pendingJson = config
                                  val intent = VpnService.prepare(this)
                                  if (intent != null) {
                                      startActivityForResult(intent, VPN_PERMISSION_CODE)
                                      result.success(false)
                                  } else {
                                      startVpn(config)
                                      result.success(true)
                                  }
                              }
                              "stop" -> {
                                  val i = Intent(this, ParsaVpnService::class.java)
                                  i.action = ParsaVpnService.ACTION_STOP
                                  startService(i)
                                  result.success(true)
                              }
                              "status" -> result.success(mapOf("connected" to ParsaVpnService.isConnected))
                              else -> result.notImplemented()
                          }
                      }
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, EVENT_CHANNEL)
                      .setStreamHandler(object : EventChannel.StreamHandler {
                          override fun onListen(arguments: Any?, events: EventChannel.EventSink?) {
                              ParsaVpnService.eventSink = events
                          }
                          override fun onCancel(arguments: Any?) {
                              ParsaVpnService.eventSink = null
                          }
                      })
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_PERMISSION_CODE && resultCode == RESULT_OK) {
                      pendingJson?.let { startVpn(it) }
                  }
                  pendingJson = null
              }

              private fun startVpn(json: String) {
                  val i = Intent(this, ParsaVpnService::class.java)
                  i.action = ParsaVpnService.ACTION_START
                  i.putExtra("config", json)
                  startService(i)
              }
          }
          EOF

      - name: Write ParsaVpnService.kt
        run: |
          cat > android/app/src/main/kotlin/com/parsavip/app/ParsaVpnService.kt << 'EOF'
          package com.parsavip.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import android.util.Log
          import io.flutter.plugin.common.EventChannel
          import java.io.File
          import java.io.FileOutputStream

          class ParsaVpnService : VpnService() {
              companion object {
                  const val TAG = "ParsaVpnService"
                  const val ACTION_START = "com.parsavip.app.START"
                  const val ACTION_STOP = "com.parsavip.app.STOP"
                  const val CHANNEL_ID = "parsavip_vpn"
                  const val NOTIF_ID = 1001
                  @Volatile var isConnected = false
                  var eventSink: EventChannel.EventSink? = null
              }

              private var tun: ParcelFileDescriptor? = null
              private var process: Process? = null

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(CHANNEL_ID, "VPN", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> startVpn(intent.getStringExtra("config") ?: "")
                      ACTION_STOP -> { stopVpn(); stopSelf() }
                  }
                  return START_STICKY
              }

              private fun startVpn(json: String) {
                  try {
                      if (json.isEmpty()) {
                          eventSink?.error("EMPTY", "Config empty", null)
                          return
                      }

                      // ۱. ساخت TUN
                      val builder = Builder()
                      builder.setSession("PARSAVIP")
                      builder.setMtu(1400)
                      builder.addAddress("172.19.0.1", 30)
                      builder.addRoute("0.0.0.0", 0)
                      builder.addDnsServer("1.1.1.1")
                      builder.addDnsServer("8.8.8.8")
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          builder.setMetered(false)
                      }
                      try { builder.addDisallowedApplication(packageName) } catch (_: Exception) {}
                      tun = builder.establish()

                      if (tun == null) {
                          eventSink?.error("TUN_FAIL", "Cannot establish TUN", null)
                          return
                      }

                      // ۲. نوشتن config
                      val f = File(filesDir, "config.json")
                      FileOutputStream(f).use { it.write(json.toByteArray()) }

                      // ۳. اجرای sing-box
                      val binPath = File(applicationInfo.nativeLibraryDir, "libsingbox.so").absolutePath
                      if (!File(binPath).exists()) {
                          Log.e(TAG, "sing-box not found at $binPath")
                          eventSink?.error("NO_BIN", "sing-box binary missing", null)
                          return
                      }

                      val pb = ProcessBuilder(binPath, "run", "-c", f.absolutePath)
                      pb.redirectErrorStream(true)
                      pb.environment()["TUN_FD"] = tun!!.fd.toString()
                      process = pb.start()

                      isConnected = true
                      showNotification()
                      eventSink?.success(mapOf("event" to "connected"))
                      Log.i(TAG, "sing-box started")

                  } catch (e: Exception) {
                      Log.e(TAG, "startVpn error", e)
                      eventSink?.error("START_FAIL", e.message, null)
                  }
              }

              private fun stopVpn() {
                  isConnected = false
                  try {
                      process?.destroy()
                      process = null
                      tun?.close()
                      tun = null
                  } catch (_: Exception) {}
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) stopForeground(STOP_FOREGROUND_REMOVE)
                  else @Suppress("DEPRECATION") stopForeground(true)
                  eventSink?.success(mapOf("event" to "disconnected"))
              }

              private fun showNotification() {
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE)
                  val si = Intent(this, ParsaVpnService::class.java).apply { action = ACTION_STOP }
                  val spi = PendingIntent.getService(this, 1, si, PendingIntent.FLAG_IMMUTABLE)

                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      Notification.Builder(this, CHANNEL_ID)
                  else
                      @Suppress("DEPRECATION") Notification.Builder(this)

                  val notif: Notification = builder
                      .setContentTitle("PARSAVIP")
                      .setContentText("متصل")
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentIntent(pi)
                      .addAction(0, "قطع", spi)
                      .setOngoing(true)
                      .build()
                  startForeground(NOTIF_ID, notif)
              }

              override fun onRevoke() { stopVpn(); stopSelf(); super.onRevoke() }
              override fun onDestroy() { stopVpn(); super.onDestroy() }
          }
          EOF

      - name: Write Dart core files
        run: |
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:provider/provider.dart';
          import 'app.dart';
          import 'providers/app_state.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light));
            await SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(ChangeNotifierProvider(
              create: (_) => AppState()..init(),
              child: const ParsaVipApp()));
          }
          EOF

          cat > lib/app.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'theme/app_theme.dart';
          import 'screens/splash_screen.dart';
          class ParsaVipApp extends StatelessWidget {
            const ParsaVipApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PARSAVIP',
                debugShowCheckedModeBanner: false,
                theme: AppTheme.dark,
                builder: (context, child) => Directionality(
                  textDirection: TextDirection.rtl,
                  child: child ?? const SizedBox()),
                home: const SplashScreen());
            }
          }
          EOF

      - name: Write theme
        run: |
          cat > lib/theme/app_theme.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          class C {
            C._();
            static const primary = Color(0xFF6C5CE7);
            static const secondary = Color(0xFF00D2FF);
            static const accent = Color(0xFFFD79A8);
            static const success = Color(0xFF00E676);
            static const danger = Color(0xFFFF5252);
            static const warning = Color(0xFFFFC107);
            static const info = Color(0xFF29B6F6);
            static const bgDark = Color(0xFF0A0E21);
            static const bgDarker = Color(0xFF05070F);
            static const bgCard = Color(0xFF151A30);
            static const bgCardLight = Color(0xFF1E2545);
            static const textPrimary = Color(0xFFFFFFFF);
            static const textSecondary = Color(0xFFB8BED4);
            static const textHint = Color(0xFF7A81A0);
            static const border = Color(0x1AFFFFFF);
            static Color pingColor(int? ms) {
              if (ms == null || ms >= 9999) return textSecondary;
              if (ms < 150) return success;
              if (ms < 350) return secondary;
              if (ms < 700) return warning;
              return danger;
            }
            static Color protoColor(String p) {
              switch (p.toLowerCase()) {
                case 'ss': return const Color(0xFF2196F3);
                case 'vless': return const Color(0xFF9C27B0);
                case 'vmess': return const Color(0xFFFF9800);
                case 'trojan': return const Color(0xFF4CAF50);
                default: return textSecondary;
              }
            }
          }
          class AppTheme {
            AppTheme._();
            static ThemeData get dark {
              final base = ThemeData.dark(useMaterial3: true);
              return base.copyWith(
                scaffoldBackgroundColor: C.bgDark,
                colorScheme: const ColorScheme.dark(
                  primary: C.primary, secondary: C.secondary,
                  surface: C.bgCard, error: C.danger),
                textTheme: GoogleFonts.vazirmatnTextTheme(base.textTheme).apply(
                  bodyColor: C.textPrimary, displayColor: C.textPrimary),
                appBarTheme: AppBarTheme(
                  backgroundColor: Colors.transparent, elevation: 0, centerTitle: true,
                  iconTheme: const IconThemeData(color: C.textPrimary),
                  titleTextStyle: GoogleFonts.vazirmatn(
                    fontSize: 18, fontWeight: FontWeight.w800,
                    color: C.textPrimary, letterSpacing: 1)),
                elevatedButtonTheme: ElevatedButtonThemeData(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: C.primary, foregroundColor: Colors.white,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                    padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 14))),
                inputDecorationTheme: InputDecorationTheme(
                  filled: true, fillColor: C.bgCardLight,
                  hintStyle: const TextStyle(color: C.textHint),
                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(14), borderSide: BorderSide.none),
                  focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(14),
                    borderSide: const BorderSide(color: C.secondary, width: 1.5)),
                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14)),
                snackBarTheme: SnackBarThemeData(
                  backgroundColor: C.bgCardLight,
                  contentTextStyle: GoogleFonts.vazirmatn(color: Colors.white),
                  behavior: SnackBarBehavior.floating));
            }
          }
          EOF

      - name: Write models
        run: |
          cat > lib/models/vpn_config.dart << 'EOF'
          enum VpnProtocol { ss, vless, vmess, trojan, unknown }
          class VpnConfig {
            final String id, name, rawUri, host;
            final VpnProtocol protocol;
            final int port;
            int? ping;
            VpnConfig({required this.id, required this.name, required this.protocol,
              required this.rawUri, required this.host, required this.port, this.ping});
            String get protocolShort {
              switch (protocol) {
                case VpnProtocol.ss: return 'SS';
                case VpnProtocol.vless: return 'VLESS';
                case VpnProtocol.vmess: return 'VMess';
                case VpnProtocol.trojan: return 'Trojan';
                case VpnProtocol.unknown: return '?';
              }
            }
            Map<String, dynamic> toJson() => {
              'id': id, 'name': name, 'protocol': protocol.name,
              'rawUri': rawUri, 'host': host, 'port': port, 'ping': ping};
            factory VpnConfig.fromJson(Map<String, dynamic> j) => VpnConfig(
              id: j['id'], name: j['name'],
              protocol: VpnProtocol.values.firstWhere((p) => p.name == j['protocol'],
                orElse: () => VpnProtocol.unknown),
              rawUri: j['rawUri'], host: j['host'], port: j['port'], ping: j['ping']);
          }
          EOF

          cat > lib/models/log_entry.dart << 'EOF'
          enum LogLevel { info, warning, error, success }
          class LogEntry {
            final String id, message;
            final LogLevel level;
            final DateTime timestamp;
            LogEntry({required this.id, required this.level, required this.message, required this.timestamp});
            Map<String, dynamic> toJson() => {'id': id, 'level': level.name,
              'message': message, 'timestamp': timestamp.toIso8601String()};
            factory LogEntry.fromJson(Map<String, dynamic> j) => LogEntry(
              id: j['id'], level: LogLevel.values.firstWhere((l) => l.name == j['level'],
                orElse: () => LogLevel.info), 

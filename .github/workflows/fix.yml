name: Fix and Build PARSAVIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Backup pubspec
        run: cp pubspec.yaml pubspec_backup.yaml

      - name: Generate platform folders
        run: |
          rm -rf android ios web linux macos windows
          flutter create --platforms=android --project-name=parsavip --org=com.parsavip .
          rm -rf test

      - name: Restore pubspec
        run: mv pubspec_backup.yaml pubspec.yaml

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/
          git add .metadata || true
          git commit -m "Auto-generate android folder" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parsavip-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

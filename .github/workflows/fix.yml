name: Build PARSAVIP APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean old android
        run: |
          rm -rf android
          rm -rf .metadata
          rm -rf .dart_tool
          rm -rf build

      - name: Generate fresh android
        run: |
          flutter create --platforms=android --project-name=parsavip --org=com.parsavip .

      - name: Clean generated lib and test
        run: |
          rm -rf lib
          rm -rf test
          mkdir -p lib/theme lib/models lib/services lib/data lib/providers lib/widgets lib/screens

      - name: Write pubspec.yaml
        run: |
          cat > pubspec.yaml << 'EOF'
          name: parsavip
          description: PARSAVIP VPN
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            provider: ^6.1.1
            google_fonts: ^6.2.1
            http: ^1.1.0
            crypto: ^3.0.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Write main.dart
        run: |
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:provider/provider.dart';
          import 'app.dart';
          import 'providers/app_state.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.light,
              ),
            );
            await SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(
              ChangeNotifierProvider(
                create: (_) => AppState()..init(),
                child: const ParsaVipApp(),
              ),
            );
          }
          EOF

      - name: Write app.dart
        run: |
          cat > lib/app.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'theme/app_theme.dart';
          import 'screens/splash_screen.dart';

          class ParsaVipApp extends StatelessWidget {
            const ParsaVipApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PARSAVIP',
                debugShowCheckedModeBanner: false,
                theme: AppTheme.dark,
                builder: (context, child) => Directionality(
                  textDirection: TextDirection.rtl,
                  child: child ?? const SizedBox(),
                ),
                home: const SplashScreen(),
              );
            }
          }
          EOF

      - name: Write theme
        run: |
          cat > lib/theme/app_theme.dart << 'EOF'
          import 'package:flutter/material.dart';

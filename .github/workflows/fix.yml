name: Build PARSAVIP

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Aggressive cleanup - keep only VPN core
        run: |
          cd android/app/src/main/java/com/v2ray/ang
          
          # پوشه‌هایی که کاملاً برای UI و غیرVPN هستن
          rm -rf ui receiver root fmt contracts helper || true
          
          # فایل‌های util که به کتابخانه‌های خارجی وابسته‌ن
          rm -f util/AppIconFetcher.kt || true
          rm -f util/HttpUtil.kt || true
          rm -f util/QRCodeDecoder.kt || true
          rm -f util/QRCodeEncoder.kt || true
          rm -f util/Utils.kt || true
          rm -f util/UtilsV2.kt || true
          rm -f util/SubscriptionUpdater.kt || true
          rm -f util/DeepLinks.kt || true
          rm -f util/ShortcutManager.kt || true
          
          # فایل‌های application level که به UI وابسته‌ن
          rm -f AngApplication.kt || true
          rm -f AppConfig.kt || true
          
          # فایل‌های extension که ممکنه به utils حذف‌شده وابسته باشن
          ls extension/ 2>/dev/null || true
          
          echo "=== Remaining .kt files ==="
          find . -name "*.kt" | sort
          
          echo ""
          echo "=== Total count ==="
          find . -name "*.kt" | wc -l

      - name: Patch build.gradle.kts
        run: |
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.parsavip.parsavip"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  buildConfig = true
              }

              defaultConfig {
                  applicationId = "com.parsavip.parsavip"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
                  multiDexEnabled = true
                  buildConfigField("String", "APPLICATION_ID", "\"com.parsavip.parsavip\"")
                  buildConfigField("String", "VERSION_NAME", "\"1.0.0\"")
                  buildConfigField("int", "VERSION_CODE", "1")
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }

              sourceSets {
                  getByName("main") {
                      java.srcDirs("src/main/java", "src/main/kotlin")
                  }
              }
          }

          dependencies {
              implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.aar", "*.jar"))))
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")

              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.preference:preference-ktx:1.2.1")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.multidex:multidex:2.0.1")

              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("com.google.code.gson:gson:2.10.1")
              implementation("com.tencent:mmkv:1.3.4")
              implementation("com.jakewharton.timber:timber:5.0.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.squareup.okhttp3:okhttp-urlconnection:4.12.0")
              implementation("com.google.zxing:core:3.5.2")
              implementation("org.apache.commons:commons-lang3:3.14.0")
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggressive cleanup + all deps" || echo "Nothing"
          git push || echo "Nothing"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
